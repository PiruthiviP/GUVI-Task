<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — UserApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-wrapper" style="align-items: flex-start; padding-top: 3rem;">
    <div class="auth-card profile-card" id="profileCard">

      <!-- Profile Header -->
      <div class="profile-header">
        <div class="profile-avatar" id="avatarInitial">?</div>
        <div class="profile-username" id="displayUsername">Loading...</div>
        <div class="profile-email" id="displayEmail"></div>
      </div>

      <!-- Profile Body -->
      <div class="profile-body">

        <!-- Messages -->
        <div id="msgSuccess" class="msg msg-success mb-3">
          <span>✓</span><span id="msgSuccessText"></span>
        </div>
        <div id="msgError" class="msg msg-error mb-3">
          <span>✕</span><span id="msgErrorText"></span>
        </div>

        <!-- Profile Details Form -->
        <form id="profileForm" novalidate>

          <div class="profile-section-title">Personal details</div>

          <div class="row g-3 mb-4">

            <div class="col-sm-6">
              <label class="form-label">Full Name</label>
              <input type="text" id="full_name" class="form-control" placeholder="Your full name" />
            </div>

            <div class="col-sm-6">
              <label class="form-label">Age</label>
              <input type="number" id="age" class="form-control" placeholder="e.g. 25" min="1" max="120" />
            </div>

            <div class="col-sm-6">
              <label class="form-label">Date of Birth</label>
              <input type="date" id="dob" class="form-control" />
            </div>

            <div class="col-sm-6">
              <label class="form-label">Contact Number</label>
              <input type="tel" id="contact" class="form-control" placeholder="+91 9876543210" />
            </div>

            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea id="address" class="form-control" rows="3" placeholder="Your address..."></textarea>
            </div>

          </div>

          <div class="d-flex gap-2 flex-wrap">
            <button type="submit" class="btn-primary-custom" id="saveBtn" style="flex:1; min-width: 140px;">
              Save changes
            </button>
            <button type="button" class="btn-danger-custom" id="logoutBtn">
              Sign out
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
