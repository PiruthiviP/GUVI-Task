<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — UserApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-dot">✦</div>
        <span class="brand-name">UserApp</span>
      </div>

      <h1 class="auth-title">Create account</h1>
      <p class="auth-sub">Join us — it only takes a minute.</p>

      <!-- Alert messages -->
      <div id="msgSuccess" class="msg msg-success">
        <span>✓</span><span id="msgSuccessText"></span>
      </div>
      <div id="msgError" class="msg msg-error">
        <span>✕</span><span id="msgErrorText"></span>
      </div>

      <!-- Register form -->
      <form id="registerForm" novalidate>
        <div class="row g-3">

          <div class="col-12">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="e.g. johndoe" required />
          </div>

          <div class="col-12">
            <label class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
          </div>

          <div class="col-sm-6">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required />
          </div>

          <div class="col-sm-6">
            <label class="form-label">Confirm password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required />
          </div>

          <div class="col-12 pt-1">
            <button type="submit" class="btn-primary-custom" id="registerBtn">
              Create account
            </button>
          </div>

        </div>
      </form>

      <div class="divider">or</div>

      <p class="text-center" style="color: var(--text-muted); font-size:0.875rem;">
        Already have an account?
        <a href="login.html" class="auth-link">Sign in</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
